kground:#173f36;color:#fff}.day.has:after{content:"";display:block;width:4px;height:4px;background:#d7a84c;border-radius:50%;margin:auto}.chat{height:calc(100vh - 190px);min-height:480px;background:#fff;border-radius:22px;padding:11px;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:7px}.bubble{max-width:84%;padding:10px 12px;border-radius:16px;font-size:12px;line-height:1.6}.assistant{align-self:flex-start;background:#edf3ef}.user{align-self:flex-end;background:#173f36;color:#fff}.nav{position:fixed;bottom:calc(9px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(calc(100% - 22px),696px);height:72px;background:#fffffff2;backdrop-filter:blur(15px);border:1px solid #dce5df;border-radius:23px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 14px 35px #18393122;z-index:20}.nav button{border:0;background:transparent;color:#8b9691;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav button.on{color:#173f36;font-weight:700}.nav span{font-size:19px}.nav small{font-size:9px}.nav .m span{background:#173f36;color:#fff;width:43px;height:43px;border-radius:14px;display:grid;place-items:center;margin-top:-22px}.sheet{border:0;border-radius:26px 26px 0 0;padding:18px;width:min(100%,720px);margin:auto 0 0;max-width:none}.sheet::backdrop{background:#0b171350}.sheet label{display:block;font-size:11px;color:#718079;margin:9px 0}.sheet input,.sheet textarea,.sheet select{width:100%;border:1px solid #e2e8e3;border-radius:12px;padding:11px;margin-top:4px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{width:100%;border:0;border-radius:14px;background:#173f36;color:#fff;padding:13px}.toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,20px);background:#14231f;color:#fff;padding:9px 14px;border-radius:99px;font-size:11px;opacity:0;transition:.2s;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0 </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">م</div><div><h1>مُعين</h1><small>مساعدك الشخصي</small></div></div><button class="bell" id="notify">◌</button></header>
<main><section id="home" class="view on"><div class="hero"><div><small id="date"></small><h2 id="hello">أهلًا تركي</h2><p id="summary">كل ما تحتاجه اليوم في مكان واحد.</p></div><div class="orb"></div></div><div class="card"><div class="head"><div><h3>قلها فقط… وأنا أرتّبها</h3><div class="muted">موعد، مهمة، فكرة أو تذكير</div></div><small id="speech">جاهز</small></div><div class="voice"><button class="mic" id="mic">⌁</button><div class="muted">اضغط وتحدث إلى مُعين</div></div><div class="composer"><input id="quick" placeholder="ذكرني غدًا الساعة 9 أتصل بمحمد"><button class="send" id="send">←</button></div><div class="quick"><button data-add="idea">✦<br>فكرة</button><button data-add="task">✓<br>مهمة</button><button data-add="event">□<br>موعد</button><button data-add="reminder">◷<br>تذكير</button></div></div><div class="section"><div class="head"><h3>اليوم</h3><button class="link" data-go="today">عرض الكل</button></div><div id="homeList" class="list"></div></div><div class="section"><div class="head"><h3>أفكارك الأخيرة</h3><button class="link" data-go="ideas">كل الأفكار</button></div><div id="recent" class="ideas"></div></div></section>

<nav class="nav"><button class="on" data-view="home"><span>⌂</span><small>الرئيسية</small></button><button data-view="today"><span>✓</span><small>اليوم</small></button><button class="m" data-view="assistant"><span>م</span><small>مُعين</small></button><button data-view="ideas"><span>✦</span><small>الأفكار</small></button><button data-view="calendar"><span>□</span><small>التقويم</small></button></nav></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='mueen_v1_items',C='mueen_v1_chat';let items=JSON.parse(localStorage.getItem(K)||'[]'),chat=JSON.parse(localStorage.getItem(C)||'[]'),filter='all',cursor=new Date(),selected=null;const lab={task:'مهمة',event:'موعد',idea:'فكرة',reminder:'تذكير'},ico={task:'✓',event:'□',idea:'✦',reminder:'◷'},months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=()=>iso(new Date()),esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uid=()=>Date.now()+Math.random().toString(16).slice(2);function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}function save(){localStorage.setItem(K,JSON.stringify(items));render()}function fmt(d){if(!d)return'';return new Intl.DateTimeFormat('ar-OM',{day:'numeric',month:'short'}).format(new Date(d+'T00:00'))}function item(x){return '<div class="item '+(x.done?'done':'')+'"><div class="ico">'+ico[x.type]+'</div><div class="main"><div class="ttl">'+esc(x.title)+'</div><div class="meta">'+[lab[x.type],fmt(x.date),x.time].filter(Boolean).join(' • ')+'</div></div>'+(x.type!=='idea'?'<button class="tiny" data-done="'+x.id+'">'+(x.done?'↺':'✓')+'</button>':'')+'<button class="tiny" data-del="'+x.id+'">×</button></div>'}function empty(t){return '<div class="empty">'+t+'</div>'}function render(){let now=new Date(),h=now.getHours();$('#hello').textContent=(h<12?'صباح الخير':'مساء الخير')+' تركي';$('#date').textContent=new Intl.DateTimeFormat('ar-OM',{weekday:'long',day:'numeric',month:'long'}).format(now);let tod=items.filter(x=>x.date===today()&&x.type!=='idea');$('#summary').textContent=tod.length?'لديك '+tod.filter(x=>!x.done).length+' عناصر تحتاج انتباهك اليوم.':'يومك هادئ حتى الآن.';$('#homeList').innerHTML=tod.slice(0,3).map(item).join('')||empty('لا توجد عناصر اليوم');let ideas=items.filter(x=>x.type==='idea').slice(-4).reverse();$('#recent').innerHTML=ideas.map(x=>'<div class="idea"><p>'+esc(x.title)+'</p><small>'+fmt((x.created||'').slice(0,10))+'</small></div>').join('')||empty('سجل أول فكرة تخطر لك');let list=tod;if(filter!=='all')list=list.filter(x=>x.type===filter);$('#todayList').innerHTML=list.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).map(item).join('')||empty('لا توجد عناصر');let done=tod.filter(x=>x.done).length;$('#metrics').innerHTML='<div class="metric"><strong>'+tod.length+'</strong><small>إجمالي اليوم</small></div><div class="metric"><strong>'+(tod.length-done)+'</strong><small>متبقي</small></div><div class="metric"><strong>'+done+'</strong><small>منجز</small></div>';renderIdeas($('#ideaSearch').value||'');renderCal();renderChat();actions()}function renderIdeas(q=''){let a=items.filter(x=>x.type==='idea'&&x.title.toLowerCase().includes(q.toLowerCase())).reverse();$('#ideaGrid').innerHTML=a.map(x=>'<div class="idea"><p>'+esc(x.title)+'</p><small>'+esc(x.notes||fmt((x.created||'').slice(0,10)))+'</small><br><button class="tiny" data-del="'+x.id+'">×</button></div>').join('')||empty('لا توجد أفكار بعد')}function renderCal(){let y=cursor.getFullYear(),m=cursor.getMonth();$('#month').textContent=months[m]+' '+y;let start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate(),html='';for(let i=0;i<42;i++){let d,o=false,dt;if(i<start){d=prev-start+i+1;dt=new Date(y,m-1,d);o=true}else if(i>=start+days){d=i-start-days+1;dt=new Date(y,m+1,d);o=true}else{d=i-start+1;dt=new Date(y,m,d)}let s=iso(dt),cl=(s===today()?' today':'')+(s===selected?' sel':'')+(items.some(x=>x.date===s&&x.type!=='idea')?' has':'');html+='<button class="day'+cl+'" data-day="'+s+'" style="'+(o?'opacity:.3':'')+'">'+d+'</button>'}$('#grid').innerHTML=html;let list=items.filter(x=>x.type!=='idea'&&x.date&&(selected?x.date===selected:x.date.startsWith(y+'-'+String(m+1).padStart(2,'0'))));$('#dayTitle').textContent=selected?new Intl.DateTimeFormat('ar-OM',{weekday:'long',day:'numeric',month:'long'}).format(new Date(selected+'T00:00')):'مواعيد الشهر';$('#calList').innerHTML=list.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(item).join('')||empty('لا توجد مواعيد مسجلة')}function renderChat(){if(!chat.length){chat=[{role:'assistant',text:'مرحبًا تركي. أنا مُعين. قل لي ما تريد أن أتذكره لك: موعد، مهمة، فكرة أو تذكير.'}];localStorage.setItem(C,JSON.stringify(chat))}$('#msgs').innerHTML=chat.map(x=>'<div class="bubble '+x.role+'">'+esc(x.text)+'</div>').join('');$('#msgs').scrollTop=$('#msgs').scrollHeight}function actions(){$$('[data-del]').forEach(b=>b.onclick=()=>{items=items.filter(x=>x.id!==b.dataset.del);save();toast('تم الحذف')});$$('[data-done]').forEach(b=>b.onclick=()=>{let x=items.find(x=>x.id===b.dataset.done);if(x)x.done=!x.done;save()});$$('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;renderCal();actions()})}function openDlg(type){$('#type').value=type;$('#dlgTitle').textContent='إضافة '+lab[type];$('#title').value='';$('#notes').value='';$('#itemDate').value=type==='idea'?'':today();$('#time').value='';$('#dlg').showModal()}$$('[data-add]').forEach(b=>b.onclick=()=>openDlg(b.dataset.add));$('#form').onsubmit=e=>{e.preventDefault();let title=$('#title').value.trim();if(!title)return;items.push({id:uid(),type:$('#type').value,title,notes:$('#notes').value.trim(),date:$('#itemDate').value,time:$('#time').value,priority:$('#priority').value,done:false,created:new Date().toISOString()});save();$('#dlg').close();toast('تم الحفظ في مُعين')};$$('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view,b));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,$('[data-view="'+b.dataset.go+'"]')));function go(id,b){$$('.view').forEach(v=>v.classList.toggle('on',v.id===id));$$('.nav button').forEach(x=>x.classList.remove('on'));b&&b.classList.add('on');scrollTo(0,0);render()}$$('[data-filter]').forEach(b=>b.onclick=()=>{$$('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});$('#ideaSearch').oninput=e=>renderIdeas(e.target.value);$('#prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);selected=null;render()};$('#next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);selected=null;render()};
function parse(t){let type='task';if(/فكر|دوّن|دون/.test(t))type='idea';else if(/موعد|اجتماع|مناسبة|زيارة|عندي/.test(t))type='event';else if(/ذكرني|تذكير|نبّه|نبه/.test(t))type='reminder';let date='',n=new Date();if(/اليوم/.test(t))date=today();if(/بكرة|غد/.test(t)){let d=new Date(n);d.setDate(d.getDate()+1);date=iso(d)}if(/بعد بكرة|بعد غد/.test(t)){let d=new Date(n);d.setDate(d.getDate()+2);date=iso(d)}let days={'الأحد':0,'الاحد':0,'الإثنين':1,'الاثنين':1,'الثلاثاء':2,'الأربعاء':3,'الاربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6};for(let [name,num] of Object.entries(days))if(t.includes(name)){let d=new Date(n),df=(num-d.getDay()+7)%7||7;d.setDate(d.getDate()+df);date=iso(d);break}let time='',m=t.match(/(?:الساعة|الساعه)\s*(\d{1,2})(?::(\d{2}))?\s*(ص|صباح|م|مساء)?/);if(m){let h=+m[1],mi=m[2]||'00';if((m[3]==='م'||m[3]==='مساء')&&h<12)h+=12;if((m[3]==='ص'||m[3]==='صباح')&&h===12)h=0;time=String(h).padStart(2,'0')+':'+mi}let title=t.replace(/^(يا\s+مُ?عين[،,]?\s*)/,'').replace(/^(ذكرني|سجل لي|سجل|دوّن|دون|أضف|اضف)\s*/,'').trim();return{type,title:title||t,date,time}}function natural(t,fromChat=false){if(!t.trim())return;let p=parse(t);items.push({id:uid(),...p,notes:'',priority:'normal',done:false,created:new Date().toISOString()});save();let msg='تم. حفظت '+lab[p.type]+': «'+p.title+'»'+(p.date?' بتاريخ '+fmt(p.date):'')+(p.time?' الساعة '+p.time:'')+'.';if(fromChat){chat.push({role:'user',text:t},{role:'assistant',text:msg});localStorage.setItem(C,JSON.stringify(chat));renderChat()}toast(msg)}$('#send').onclick=()=>{natural($('#quick').value);$('#quick').value=''};$('#quick').onkeydown=e=>{if(e.key==='Enter')$('#send').click()};$('#chatSend').onclick=()=>{natural($('#chat').value,true);$('#chat').value=''};$('#chat').onkeydown=e=>{if(e.key==='Enter')$('#chatSend').click()};
function speech(target){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('التعرف الصوتي غير متاح في هذا المتصفح');return}let r=new SR;r.lang='ar-OM';$('#speech').textContent='أسمعك…';$('#mic').classList.add('listening');r.onresult=e=>{let t=e.results[0][0].transcript;natural(t,target==='chat')};r.onend=()=>{$('#speech').textContent='جاهز';$('#mic').classList.remove('listening')};r.onerror=()=>toast('تعذر التقاط الصوت');r.start()}$('#mic').onclick=()=>speech('home');$('#chatMic').onclick=()=>speech('chat');$('#notify').onclick=async()=>{if(!('Notification'in window))return toast('الإشعارات غير مدعومة هنا');let p=await Notification.requestPermission();toast(p==='granted'?'تم تفعيل الإشعارات':'لم يتم منح الإذن')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
