name: Publish Android preview
on:
  workflow_run:
    workflows: ['Build Mueen mobile']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish verified Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" --name Mueen-Android-debug --dir download
          test -s download/app-debug.apk
          cp download/app-debug.apk Mueen-Android-v1.0.2.apk
          sha256sum Mueen-Android-v1.0.2.apk > SHA256SUMS.txt
          gh release create android-preview-20261016-v1.0.2 Mueen-Android-v1.0.2.apk SHA256SUMS.txt --target "$SOURCE_COMMIT" --prerelease --title "مُعين — تجربة Android 1.0.2" --notes "أوامر جديدة: «معين عين لي منبه الساعة 5 مساءً» لطلب ضبط المنبه في تطبيق الساعة الأصلي، و«معين اتصل في الاسم الحين» للبحث عن تطابق واحد واضح في جهات الاتصال وبدء الاتصال بعد منح الإذن. قد يعرض تطبيق الساعة شاشة تأكيد. عند تعدد أرقام الاسم لن يُجرى اتصال تلقائي. نسخة تجريبية لهواتف Android 7 أو أحدث. إذا ثبتّ نسخة سابقة، زامن بياناتك بحسابك أولاً ثم احذفها لأن مفتاح توقيع البناء التجريبي مختلف. البيانات المحلية غير المتزامنة ستُفقد عند الحذف."
