name: Publish corrected Android preview
on:
  workflow_run:
    workflows: ['Build Mueen mobile']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish verified Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh run download "$RUN_ID" --name Mueen-Android-debug --dir download
          test -s download/app-debug.apk
          cp download/app-debug.apk Mueen-Android-v1.0.1.apk
          sha256sum Mueen-Android-v1.0.1.apk > SHA256SUMS.txt
          gh release create android-preview-20261016-v1.0.1 Mueen-Android-v1.0.1.apk SHA256SUMS.txt --target "$SOURCE_COMMIT" --prerelease --title "مُعين — تجربة Android 1.0.1" --notes "تصحيح ترحيب المستخدم الجديد: يظهر اسم صاحب الحساب بعد التسجيل أو الدخول، وتعود التحية العامة بعد الخروج. نسخة تجريبية لهواتف Android 7 أو أحدث. إذا ثبتّ النسخة التجريبية السابقة، زامن بياناتك بحسابك أولاً ثم احذفها قبل تثبيت هذه النسخة لأن مفتاح توقيع البناء التجريبي مختلف. بعد التثبيت سجل دخولك بالحساب نفسه لاستعادة بياناتك المتزامنة."
